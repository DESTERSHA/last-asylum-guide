name: Данные сервера 397
# Раз в 30 минут забирает данные топ-30 альянсов сервера 397
# (ключ — в закрытых настройках репозитория, TRACKER_KEY) и обновляет файлы data/tracker/.
on:
  schedule:
    - cron: "*/10 * * * *"  # запасной будильник (GitHub часть пропускает); срабатывает, только если робот молчит больше 40 мин; основной — tracker-timer
  workflow_dispatch:
    inputs:
      players:
        description: "Сколько игроков обновить за этот запуск (обычно 60; на игрока до 2 запросов)"
        required: false
        default: "60"
      force:
        description: "1 — обновить сразу, даже если с прошлого раза меньше 25 мин (таймер шлёт 0)"
        required: false
        default: "1"
permissions:
  contents: write
  pages: write
  actions: write
concurrency:
  group: tracker
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Закрытое хранилище (вступления и выходы — платная часть)
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone --depth 20 git@github.com:ozzi3690-oss/la397-tracker-private.git private
      - name: Сбор данных
        env:
          PRIVATE_DIR: private
          TRACKER_KEY: ${{ secrets.TRACKER_KEY }}
          TRACKER_API: ${{ secrets.TRACKER_API }}
          LA_SB_PUSH: ${{ secrets.LA_SB_PUSH }}
          PLAYERS: ${{ github.event.inputs.players || '60' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force == '1' && '1' || '' }}
          MINGAP: ${{ github.event_name == 'schedule' && '40' || '15' }}
        run: python tools/tracker_sync.py
      - name: Сохранить
        id: save
        run: |
          git config user.name "tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/tracker
          if git diff --cached --quiet; then echo "без изменений"; exit 0; fi
          git commit -m "Данные сервера 397: $(date -u +'%Y-%m-%d %H:%M') UTC"
          echo "changed=1" >> "$GITHUB_OUTPUT"
          # если прошлый запуск успел записать те же файлы — оставляем наш снимок (он свежее); -X theirs при rebase = наш коммит
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; git rebase --abort 2>/dev/null || true; sleep 5; done
          exit 1
      - name: Сохранить закрытое
        if: always()
        run: |
          cd private
          git config user.name "tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "без изменений"; exit 0; fi
          git commit -m "Вступления и выходы: $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; git rebase --abort 2>/dev/null || true; sleep 5; done
          exit 1
      - name: Пересобрать сайт
        if: steps.save.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || true
      - name: Проверить, что таймер работает (если пропал — завести)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list --repo ${{ github.repository }} --workflow tracker-timer.yml --limit 10 --json status -q '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="waiting" or .status=="pending")] | length')
          if [ "${n:-0}" = "0" ]; then echo "таймера нет — завожу"; gh workflow run tracker-timer.yml --repo ${{ github.repository }} || true; else echo "таймер работает ($n)"; fi
