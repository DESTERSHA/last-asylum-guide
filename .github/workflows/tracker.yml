name: Данные сервера 397
# Каждые 3 часа забирает данные топ-30 альянсов сервера 397
# (ключ — в закрытых настройках репозитория, TRACKER_KEY) и обновляет файлы data/tracker/.
on:
  schedule:
    - cron: "7,27,47 * * * *"  # GitHub пропускает запуски по расписанию; робот сам ждёт 2 ч 50 мин между обновлениями
  workflow_dispatch:
    inputs:
      players:
        description: "Сколько игроков обновить за этот запуск (обычно 25; на игрока 2 запроса)"
        required: false
        default: "25"
permissions:
  contents: write
  pages: write
  actions: write
concurrency:
  group: tracker
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Закрытое хранилище (вступления и выходы — платная часть)
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone --depth 20 git@github.com:ozzi3690-oss/la397-tracker-private.git private
      - name: Сбор данных
        env:
          PRIVATE_DIR: private
          TRACKER_KEY: ${{ secrets.TRACKER_KEY }}
          TRACKER_API: ${{ secrets.TRACKER_API }}
          PLAYERS: ${{ github.event.inputs.players || '25' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python tools/tracker_sync.py
      - name: Сохранить
        run: |
          git config user.name "tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/tracker
          if git diff --cached --quiet; then echo "без изменений"; exit 0; fi
          git commit -m "Данные сервера 397: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
      - name: Сохранить закрытое
        if: always()
        run: |
          cd private
          git config user.name "tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "без изменений"; exit 0; fi
          git commit -m "Вступления и выходы: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
      - name: Пересобрать сайт
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || true
      - name: Завести таймер на следующее обновление
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run tracker-timer.yml --repo ${{ github.repository }} || true
