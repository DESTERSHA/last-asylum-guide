name: Таймер данных сервера 397
# GitHub выбрасывает запуски по расписанию, а каждый новый запуск может ждать свободную машину (18.11 ждали 1,5 ч).
# Поэтому один запуск таймера держится 5,5 ч и сам будит робота каждые 10 мин (робот одним запросом проверяет, есть ли у трекера новое) (ручной запуск GitHub выполняет всегда),
# потом заводит себя заново. Если таймер всё же пропал — робот в конце своего запуска заведёт его снова.
on:
  workflow_dispatch:
permissions:
  actions: write
concurrency:
  group: tracker-timer
  cancel-in-progress: false   # не обрываем работающий таймер; лишний завод просто ждёт в очереди
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Будить робота каждые 10 мин (33 раза)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 33); do
            sleep 600
            echo "запуск робота №$i: $(date -u +'%H:%M') UTC"
            gh workflow run tracker.yml --repo ${{ github.repository }} -f force=0 || echo "не удалось запустить робота"
          done
      - name: Завести таймер заново
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run tracker-timer.yml --repo ${{ github.repository }}
